<body>

<div id="hint">move/aim: arrows·WASD·drag·mouse &nbsp;·&nbsp; space fire &nbsp;·&nbsp; Q drone-cam &nbsp;·&nbsp; E sub-cam &nbsp;·&nbsp; F mine</div>
<div id="upd">↻ Update ready — tap to reload</div>
<script>
(function(){
  var BUILD="1786065189";
  function goTo(b){ location.replace('index.html?v='+b); }
  function chip(b){ var el=document.getElementById('upd'); if(el){ el.style.display='block'; el.onclick=function(){ goTo(b); }; } }
  function check(initial){
    fetch('version.json?t='+Date.now(),{cache:'no-store'})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){
        if(!j||!j.build||String(j.build)===String(BUILD)) return;
        if(initial){
          try{ if(sessionStorage.getItem('smsReload')===String(j.build)) return; sessionStorage.setItem('smsReload',String(j.build)); }catch(e){}
          goTo(j.build);
        } else chip(j.build);
      })
      .catch(function(){});
  }
  check(true);
  setInterval(function(){ check(false); }, 60000);
})();
</script>
<script>
"use strict";
//======================================================================== SEA MONSTER SURVIVAL v4
const VW=480,VH=270,WATER_Y=92,SEA_BOTTOM=VH-6;
const cv=document.getElementById('c'),ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
let scale=1;
function resize(){ const w=innerWidth,h=innerHeight; scale=Math.max(1,Math.floor(Math.min(w/VW,h/VH)));
  if(VW*scale>w||VH*scale>h) scale=Math.min(w/VW,h/VH);
  cv.width=VW*scale; cv.height=VH*scale; cv.style.width=(VW*scale)+'px'; cv.style.height=(VH*scale)+'px'; ctx.imageSmoothingEnabled=false; }
addEventListener('resize',resize); resize();

//------------------------------------------------------------ DATA
const MONSTERS={
  maja:  {key:'maja',  name:'EL GRAN MAJA', blurb:'Serpent of the trench. Six red eyes. Endless teeth.',
          body:'#7a2e22',body2:'#a84a34',pale:'#c9b39a',eye:'#ff2a2a',kind:'serpent',size:1.2,spd:1.1,hp:1000,fin:'swallow'},
  bloop: {key:'bloop', name:'THE BLOOP',    blurb:'A sound too vast to be alive. And yet it moves.',
          body:'#2f4a5e',body2:'#43647d',pale:'#9fc0d4',eye:'#c9f4ff',kind:'leviathan',size:1.45,spd:0.92,hp:1000,fin:'swallow'},
  kraken:{key:'kraken',name:'THE KRAKEN',   blurb:'Ten arms, no mercy. It drags you into the dark.',
          body:'#4a1f3d',body2:'#6e2f59',pale:'#9a5b86',eye:'#ffd23b',kind:'kraken',size:1.3,spd:1.04,hp:1000,fin:'drag'},
  ningen:{key:'ningen',name:'NINGEN',       blurb:'Pale, smooth, almost human. That is the worst part.',
          body:'#dfe6e6',body2:'#c2cfcf',pale:'#eef4f4',eye:'#0a0f14',kind:'humanoid',size:1.18,spd:1.0,hp:1000,fin:'swallow'},
  seaeater:{key:'seaeater',name:'SEA EATER', blurb:'No eyes. No lure. Only a jaw that finds you anyway.',
          body:'#182a30',body2:'#26444c',pale:'#dfe8c0',eye:'#182a30',kind:'seaeater',size:1.35,spd:0.98,hp:1000,fin:'swallow'},
  nessie:{key:'nessie',name:'LOCH NESS', blurb:'The long neck rises from the dark. The legend was hungry.',
          body:'#3a5a3f',body2:'#4e7452',pale:'#a8c090',eye:'#101820',kind:'nessie',size:1.22,spd:1.0,hp:1000,fin:'swallow'},
};
const EMMA={key:'emma',name:'EMMA',kind:'emma',body:'#f3c99a',body2:'#e0507a',pale:'#f2d16b',eye:'#20303a',size:1.55,spd:1.02,hp:1700,fin:'swallow'};
const CTHULHU={key:'cthulhu',name:'CTHULHU',kind:'cthulhu',body:'#2f5a3a',body2:'#204028',pale:'#9fd06a',eye:'#ffcf3b',size:1.75,spd:1.06,hp:2200,fin:'drag'};
const ALL={...MONSTERS,emma:EMMA,cthulhu:CTHULHU};
const ROSTER=['maja','bloop','kraken','ningen','seaeater','nessie'];
const VEHICLES={
  boat: {key:'boat', name:'RESEARCH BOAT', surface:true,  spd:1.18, blurb:'Fast on the surface. Blind to the deep below.'},
  sub:  {key:'sub',  name:'SUBMARINE',     surface:false, spd:0.92, blurb:'Dives deep and armored. Slow to turn.'},
  scuba:{key:'scuba',name:'SCUBA DIVE',    surface:false, spd:1.32, blurb:'Nimble and brave. Nothing between you and it.'},
};
const DIFFS={ easy:{name:'EASY',hp:350,aggroMul:0.85}, med:{name:'MEDIUM',hp:240,aggroMul:1.0}, hard:{name:'HARD',hp:150,aggroMul:1.3} };
const RUN_SECONDS=900, TOTAL_MINES=13;
const DMG_GUN=0.03, DMG_TOOL=0.05; // fraction of monster max HP
const POVWIN={x:VW-238,y:36,w:232,h:130}; // quarter-screen cam window

//------------------------------------------------------------ AUDIO
let actx=null,master=null,musicGain=null,musicOn=true,musicMode='none',shantyTO=null,huntTO=null,huntTgl=false,patternStart=0;
const NOTE={rest:0,E2:82.41,F2:87.31,G2:98,A2:110,Bb2:116.54,B2:123.47,C3:130.81,D3:146.83,E3:164.81,F3:174.61,G3:196,A3:220,Bb3:233.08,B3:246.94,
  C4:261.63,D4:293.66,E4:329.63,F4:349.23,G4:392,A4:440,Bb4:466.16,C5:523.25,D5:587.33,D2:73.42};
const EI=0.185;
const LEAD_A=[['D4',2],['A3',1],['D4',1],['F4',2],['E4',2],['D4',1],['C4',1],['D4',2],['F4',2],['A4',1],['G4',1],['F4',2],['E4',3],['A3',3],
  ['D4',2],['A3',1],['D4',1],['F4',2],['G4',2],['F4',1],['E4',1],['D4',2],['Bb3',2],['C4',1],['D4',1],['E4',2],['D4',4],['rest',2]];
const LEAD_B=[['A4',2],['A4',1],['G4',1],['F4',2],['G4',2],['F4',1],['E4',1],['D4',2],['F4',2],['G4',1],['A4',1],['D5',2],['C5',3],['A4',3],
  ['A4',2],['A4',1],['G4',1],['F4',2],['G4',2],['A4',1],['Bb4',1],['A4',2],['G4',2],['F4',1],['E4',1],['D4',2],['D4',4],['rest',2]];
const LEAD=LEAD_A.concat(LEAD_B);
const bassRoots=['D3','A2','Bb2','A2','D3','G2','A2','A2','D3','F3','Bb2','A2','D3','G2','A2','D3'];
const BASS=[]; bassRoots.forEach(r=>{BASS.push([r,3]);BASS.push([r,3]);});
const LOOP_EI=96,LOOP_LEN=LOOP_EI*EI;
function initAudio(){ if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain(); master.gain.value=0.9; master.connect(actx.destination);
    musicGain=actx.createGain(); musicGain.gain.value=musicOn?0.15:0; musicGain.connect(master); setMusic('shanty'); }catch(e){} }
function tone(f,start,dur,type,peak,dest){ if(!f)return; const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;o.frequency.value=f; g.gain.setValueAtTime(0,start); g.gain.linearRampToValueAtTime(peak,start+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,start+dur*0.95); o.connect(g); g.connect(dest||master); o.start(start); o.stop(start+dur); }
function noise(start,dur,peak,hp){ const n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n); const s=actx.createBufferSource();s.buffer=buf;const g=actx.createGain();g.gain.value=peak;
  if(hp){const f=actx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(g);}else s.connect(g); g.connect(master); s.start(start); }
function kick(t){ const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';
  o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(50,t+0.12);
  g.gain.setValueAtTime(0.4,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);o.connect(g);g.connect(musicGain);o.start(t);o.stop(t+0.15); }
function setMusic(mode){ if(!actx||musicMode===mode) return; musicMode=mode; clearTimeout(shantyTO); clearTimeout(huntTO);
  if(mode==='shanty'){ patternStart=actx.currentTime+0.1; shantyTick(); } else if(mode==='hunt'){ huntTick(); } }
function shantyTick(){ if(!actx||musicMode!=='shanty') return; const t0=patternStart;
  let t=t0; for(const [n,d] of LEAD){ if(n!=='rest') tone(NOTE[n],t,d*EI*0.9,'square',0.4,musicGain); t+=d*EI; }
  let tb=t0; for(const [n,d] of BASS){ if(n!=='rest') tone(NOTE[n],tb,d*EI*0.95,'triangle',0.7,musicGain); tb+=d*EI; }
  for(let i=0;i<LOOP_EI;i++){ const te=t0+i*EI,bar=Math.floor(i/6),rf=NOTE[bassRoots[bar]]||147,beat=i%6;
    if(i%2===1) tone(rf*2,te,EI*0.5,'triangle',0.14,musicGain); if(beat===0||beat===3) kick(te); }
  patternStart+=LOOP_LEN; shantyTO=setTimeout(shantyTick,(LOOP_LEN*1000)-60); }
function huntTick(){ if(!actx||musicMode!=='hunt') return; const aggro=G?clamp(0.14+G.aggroLvl*0.05,0.14,1):0.2;
  const t=actx.currentTime+0.02; huntTgl=!huntTgl; const f=huntTgl?NOTE.E2:NOTE.F2;
  tone(f,t,0.15,'sawtooth',0.5,musicGain); tone(f/2,t,0.18,'triangle',0.34,musicGain);
  if(aggro>0.6 && Math.random()<0.25) tone(NOTE.C3,t,0.25,'sawtooth',0.18,musicGain);
  const interval=0.54-aggro*0.42; huntTO=setTimeout(huntTick,interval*1000); }
function sfx(kind,pitch){ if(!actx)return; const t=actx.currentTime; const p=pitch||1;
  if(kind==='shoot'){ tone(880,t,0.08,'square',0.24); tone(1320,t+0.02,0.06,'square',0.15); }
  else if(kind==='hit'){ tone(150,t,0.18,'sawtooth',0.36); noise(t,0.15,0.28); }
  else if(kind==='scare'){ for(let i=0;i<5;i++) tone(720-i*95,t+i*0.03,0.1,'square',0.14); }
  else if(kind==='roar'){ tone(60*p,t,0.65,'sawtooth',0.4); tone(90*p,t,0.65,'triangle',0.26); tone(46*p,t,0.7,'sine',0.3); for(let i=0;i<4;i++) tone((70+i*8)*p,t+i*0.08,0.2,'sawtooth',0.14); }
  else if(kind==='swim'){ noise(t,0.22,0.09,300); tone(70,t,0.2,'sine',0.1); }
  else if(kind==='swoosh'){ noise(t,0.18,0.18,500); tone(120,t,0.16,'sawtooth',0.14); }
  else if(kind==='boom'){ noise(t,0.5,0.5); tone(90,t,0.5,'sawtooth',0.4); tone(60,t+0.05,0.5,'triangle',0.3); }
  else if(kind==='deploy'){ tone(400,t,0.15,'square',0.2); tone(620,t+0.08,0.2,'triangle',0.2); }
  else if(kind==='mine'){ tone(520,t,0.05,'square',0.18); tone(360,t+0.05,0.08,'triangle',0.16); }
  else if(kind==='stun'){ for(let i=0;i<8;i++) tone(200+((i%2)?70:0),t+i*0.05,0.05,'square',0.2); }
  else if(kind==='fart'){ const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';
    o.frequency.setValueAtTime(180,t);o.frequency.linearRampToValueAtTime(70,t+0.35); const lfo=actx.createOscillator(),lg=actx.createGain();
    lfo.frequency.value=18;lg.gain.value=25;lfo.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0.28,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.4);o.connect(g);g.connect(master);o.start(t);lfo.start(t);o.stop(t+0.42);lfo.stop(t+0.42); noise(t+0.05,0.3,0.12,200); }
  else if(kind==='smash'){ tone(160,t,0.3,'square',0.3); tone(80,t,0.4,'sawtooth',0.3); noise(t,0.3,0.3); }
  else if(kind==='win'){ ['C4','E4','G4','C5'].forEach((n,i)=>tone(NOTE[n],t+i*0.13,0.2,'square',0.3)); }
  else if(kind==='fanfare'){ ['C4','E4','G4','C5','G4','C5'].forEach((n,i)=>tone(NOTE[n],t+i*0.16,0.28,'square',0.3)); }
  else if(kind==='lose'){ ['D4','C4','A3','F3','D3','A2'].forEach((n,i)=>tone(NOTE[n]||147,t+i*0.16,0.34,'sawtooth',0.3)); }
  else if(kind==='select'){ tone(660,t,0.06,'square',0.22); tone(990,t+0.04,0.06,'square',0.16); }
}
function toggleMusic(){ musicOn=!musicOn; if(musicGain) musicGain.gain.value=musicOn?0.15:0; }

//------------------------------------------------------------ INPUT
const keys={}; let fireEdge=false,fireHeld=false,mouseDown=false;
const mouseAim={x:0,y:0,active:false,t:0};
addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(e.key===' '){ if(state==='title'||state==='win'||state==='lose') tapAt(VW/2,VH/2,'tap'); else fireEdge=true; }
  if(k==='q') edgeTool('drone'); if(k==='e') edgeTool('sub'); if(k==='f') plantMine(); });
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
function toVirt(cx,cy){ const r=cv.getBoundingClientRect(); return {x:(cx-r.left)/scale,y:(cy-r.top)/scale}; }
const touches={}; const uiButtons=[];
let joy={active:false,id:null,ox:0,oy:0,x:0,y:0};
const fireBtn={x:VW-44,y:VH-44,r:24},subBtn={x:VW-96,y:VH-86,r:15},droneBtn={x:VW-96,y:VH-52,r:15},mineBtn={x:VW-96,y:VH-18,r:15},musicBtn={x:VW-20,y:14,r:11};
function dist(x1,y1,x2,y2){return Math.hypot(x1-x2,y1-y2);}
function touchStart(id,vx,vy){
  if(dist(vx,vy,musicBtn.x,musicBtn.y)<musicBtn.r+4){ toggleMusic(); return; }
  if(state==='play'){
    if(dist(vx,vy,fireBtn.x,fireBtn.y)<fireBtn.r+6){ touches[id]={role:'fire'}; fireHeld=true; fireEdge=true; return; }
    if(dist(vx,vy,droneBtn.x,droneBtn.y)<droneBtn.r+8){ touches[id]={role:'b'}; edgeTool('drone'); return; }
    if(dist(vx,vy,subBtn.x,subBtn.y)<subBtn.r+8){ touches[id]={role:'b'}; edgeTool('sub'); return; }
    if(dist(vx,vy,mineBtn.x,mineBtn.y)<mineBtn.r+8){ touches[id]={role:'b'}; plantMine(); return; }
    if(!joy.active){ joy.active=true; joy.id=id; joy.ox=vx; joy.oy=vy; joy.x=vx; joy.y=vy; touches[id]={role:'joy'}; return; }
    touches[id]={role:'none'};
  } else tapAt(vx,vy,'tap');
}
function touchMoveH(id,vx,vy){ const t=touches[id]; if(t&&t.role==='joy'){ joy.x=vx; joy.y=vy; } }
function touchEndH(id){ const t=touches[id]; if(t){ if(t.role==='joy') joy.active=false; if(t.role==='fire') fireHeld=false; delete touches[id]; } }
cv.addEventListener('touchstart',e=>{ e.preventDefault(); initAudio(); for(const tc of e.changedTouches){ const p=toVirt(tc.clientX,tc.clientY); touchStart(tc.identifier,p.x,p.y);} },{passive:false});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); for(const tc of e.changedTouches){ const p=toVirt(tc.clientX,tc.clientY); touchMoveH(tc.identifier,p.x,p.y);} },{passive:false});
cv.addEventListener('touchend',e=>{ e.preventDefault(); for(const tc of e.changedTouches) touchEndH(tc.identifier); },{passive:false});
cv.addEventListener('touchcancel',e=>{ for(const tc of e.changedTouches) touchEndH(tc.identifier); });
cv.addEventListener('mousemove',e=>{ const p=toVirt(e.clientX,e.clientY); mouseAim.x=p.x; mouseAim.y=p.y; mouseAim.active=true; mouseAim.t=performance.now(); });
cv.addEventListener('mousedown',e=>{ initAudio(); mouseDown=true; const p=toVirt(e.clientX,e.clientY);
  if(dist(p.x,p.y,musicBtn.x,musicBtn.y)<musicBtn.r+4){ toggleMusic(); return; }
  if(state==='play'){
    if(dist(p.x,p.y,droneBtn.x,droneBtn.y)<droneBtn.r+8){ edgeTool('drone'); return; }
    if(dist(p.x,p.y,subBtn.x,subBtn.y)<subBtn.r+8){ edgeTool('sub'); return; }
    if(dist(p.x,p.y,mineBtn.x,mineBtn.y)<mineBtn.r+8){ plantMine(); return; }
    fireHeld=true; fireEdge=true;
  } else tapAt(p.x,p.y,'tap');
});
addEventListener('mouseup',()=>{ mouseDown=false; fireHeld=false; });

//------------------------------------------------------------ STATE
let state='title', sel={monster:null,vehicle:null,time:null,diff:null}, G=null;
function tapAt(vx,vy,src){
  if(state==='title'){ sfx('select'); state='monster'; return; }
  if(state==='win'||state==='lose'){ sfx('select'); resetToTitle(); return; }
  for(const b of uiButtons){ if(inRect(vx,vy,b)){ handleMenu(b.id); return; } }
}
function pickBtn(){ return {x:VW/2-60,y:VH-70,w:120,h:26}; }
function inRect(x,y,r){ return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h; }
function handleMenu(id){ sfx('select');
  if(id.startsWith('mon:')){ sel.monster=id.slice(4); state='vehicle'; }
  else if(id.startsWith('veh:')){ sel.vehicle=id.slice(4); state='time'; }
  else if(id.startsWith('time:')){ sel.time=id.slice(5); state='diff'; }
  else if(id.startsWith('diff:')){ sel.diff=id.slice(5); startGame(); }
  else if(id==='back:monster'){ state='monster'; } else if(id==='back:vehicle'){ state='vehicle'; } else if(id==='back:time'){ state='time'; }
  else if(id==='again'){ resetToTitle(); }
}
function edgeTool(which){ if(state!=='play'||!G||G.result||G.transition>0||G.rig) return;
  if(which==='drone'&&G.drone.cd<=0){ openRig('drone'); }
  if(which==='sub'&&G.subTool.cd<=0){ openRig('sub'); } }
function openRig(type){ const y=type==='drone'?Math.max(WATER_Y-10,G.py-30):Math.max(G.py,WATER_Y+14);
  G.rig={type,x:G.px,y,dir:Math.atan2(G.my-G.py,G.mx-G.px),timer:10,fireCd:0}; sfx('deploy'); }
function endRig(){ if(G.rig.type==='drone') G.drone.cd=15; else G.subTool.cd=15; G.rig=null; }
function plantMine(){ if(state!=='play'||!G||G.result||G.transition>0||G.rig) return;
  if(G.minesLeft<=0||G.plantCd>0) return; G.mines.push({x:G.px,y:clamp(G.py+8,WATER_Y+8,SEA_BOTTOM-3),arm:0.7,blink:0}); G.minesLeft--; G.plantCd=0.4; sfx('mine'); }
function resetToTitle(){ sel={monster:null,vehicle:null,time:null,diff:null}; G=null; state='title'; setMusic('shanty'); }
function startGame(){
  const v=VEHICLES[sel.vehicle], diff=DIFFS[sel.diff];
  const idx=ROSTER.indexOf(sel.monster), order=[]; for(let i=0;i<ROSTER.length;i++) order.push(ROSTER[(idx+i)%ROSTER.length]);
  const full=order.concat(['emma','cthulhu']); const first=full.shift();
  G={ v, diff, night:sel.time==='night', phpMax:diff.hp, php:diff.hp,
    px:120, py:v.surface?WATER_Y-2:170, faceR:true, aim:0, hits:0, stun:0, invul:0, fireCd:0,
    proj:[], parts:[], bubbles:[], mines:[], farts:[],
    control:'player', rig:null, rigShots:[], drone:{cd:0}, subTool:{cd:0}, minesLeft:TOTAL_MINES, plantCd:0,
    queue:full, killedCount:0, isEmma:false, isCthulhu:false, transition:0, pendingNext:null, smashT:0, fartCd:0,
    timeLeft:RUN_SECONDS, aggroLvl:0,
    result:null, finish:0, finishKind:null, resultHow:null, shake:0, flash:0, redFlash:0, roarCd:2, swimCd:0, elapsed:0 };
  for(let i=0;i<26;i++) G.bubbles.push({x:rnd(0,VW),y:rnd(WATER_Y,VH),s:rnd(1,3),v:rnd(6,18)});
  spawnMonster(first); state='play'; setMusic('hunt');
}

      const tx=bx+Math.sin(T*4+tn+s*0.6)*(s*1.1)+dir*reach*(s/6), ty=y-8+s*4; px(tx-1,ty,3,5,s%2?m.body:m.body2); } } // face tentacles

let stars=[]; for(let i=0;i<40;i++) stars.push({x:rnd(0,VW),y:rnd(0,WATER_Y-6),b:rnd(0.3,1)});
function drawSky(night){ if(night){ for(let y=0;y<WATER_Y;y++) px(0,y,VW,1,mix('#070b1e','#1a2450',y/WATER_Y));
    for(const s of stars) px(s.x,s.y,1,1,`rgba(220,230,255,${s.b})`); px(VW-70,16,18,18,'#e9ecd6'); px(VW-66,20,10,10,'#0d1330'); }
  else { for(let y=0;y<WATER_Y;y++) px(0,y,VW,1,mix('#3f9fd6','#bfe6f5',y/WATER_Y)); px(64,16,22,22,'#ffe27a'); px(60,20,30,14,'rgba(255,240,150,0.3)'); } }
function drawSea(night,t){ const top=night?'#0d3450':'#1d6ea3',bot=night?'#03101d':'#08283e';
  for(let y=WATER_Y;y<VH;y++) px(0,y,VW,1,mix(top,bot,(y-WATER_Y)/(VH-WATER_Y)));
  for(let x=0;x<VW;x+=6){ const yy=WATER_Y+Math.sin((x+t*40)*0.06)*1.6; px(x,yy,4,2,night?'#2a6f96':'#8fd0ec'); } px(0,WATER_Y-2,VW,2,night?'#0d3450':'#2b86bd'); }
function mix(a,b,t){ const ca=hx(a),cb=hx(b); return `rgb(${Math.round(ca[0]+(cb[0]-ca[0])*t)},${Math.round(ca[1]+(cb[1]-ca[1])*t)},${Math.round(ca[2]+(cb[2]-ca[2])*t)})`; }
function hx(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }

//------------------------------------------------------------ LOOP
let last=performance.now();
function loop(now){ let dt=(now-last)/1000; last=now; if(dt>0.05) dt=0.05; if(state==='play') updatePlay(dt); render(); requestAnimationFrame(loop); }
function updatePlay(dt){
  const g=G,m=g.m,v=g.v; g.elapsed+=dt;
  if(g.result){ g.finish+=dt; const dur=g.result==='lose'?4.4:3.4; if(g.result==='lose'&&g.finish<1.6){ g.shake=6; g.redFlash=0.5; } if(g.finish>dur) state=g.result; updateParts(dt); return; }
  if(g.transition>0){ g.transition-=dt; g.my+=18*dt; g.timeLeft-=dt; updateParts(dt);
    if(g.drone.cd>0) g.drone.cd-=dt; if(g.subTool.cd>0) g.subTool.cd-=dt;
    if(g.timeLeft<=0){ finalWin('survived'); return; }
    if(g.transition<=0){ g.php=Math.min(g.phpMax,g.php+g.phpMax*0.4); spawnMonster(g.pendingNext); } return; }

  g.timeLeft-=dt; if(g.timeLeft<=0){ finalWin('survived'); return; }
  const gp=1-(g.timeLeft/RUN_SECONDS), aggro=clamp((0.14+gp*0.86)*g.diff.aggroMul,0.14,1), lvl=Math.floor(gp*16);
  if(lvl>g.aggroLvl){ g.aggroLvl=lvl; sfx('roar',m.kind==='emma'?1.4:(m.kind==='cthulhu'?0.7:1)); g.shake=5; }

  // input
  let ix=0,iy=0;
  if(keys['arrowleft']||keys['a']) ix-=1; if(keys['arrowright']||keys['d']) ix+=1;
  if(keys['arrowup']||keys['w']) iy-=1; if(keys['arrowdown']||keys['s']) iy+=1;
  if(joy.active){ const jx=joy.x-joy.ox,jy=joy.y-joy.oy,d=Math.hypot(jx,jy); if(d>4){ ix=clamp(jx/28,-1,1); iy=clamp(jy/28,-1,1);} }
  const now=performance.now();

  if(g.rig){ driveRig(dt,ix,iy); }
  else {
    const spd=88*v.spd; let mx2=ix,my2=iy; if(g.stun>0){ mx2=0; my2=0; }
    if(mx2<0) g.faceR=false; if(mx2>0) g.faceR=true;
    g.px=clamp(g.px+mx2*spd*dt,24,VW-24);
    if(v.surface) g.py=WATER_Y-2+Math.sin(g.elapsed*2)*2; else g.py=clamp(g.py+my2*spd*dt,WATER_Y+8,SEA_BOTTOM-8);
    if(mouseAim.active && now-mouseAim.t<2000) g.aim=Math.atan2(mouseAim.y-g.py,mouseAim.x-g.px); else if(ix||iy) g.aim=Math.atan2(iy,ix);
    g.fireCd-=dt;
    if((fireHeld||keys[' ']) && g.stun<=0 && g.fireCd<=0){ g.fireCd=0.26; g.proj.push({x:g.px,y:g.py,vx:Math.cos(g.aim)*270,vy:Math.sin(g.aim)*270,life:1.5}); sfx('shoot'); }
  }
  fireEdge=false;

  // harpoons (3%)
  for(const p of g.proj){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(dist(p.x,p.y,g.mx,g.my)<g.mrad){ p.life=0; damageMonster(g.mhpMax*DMG_GUN,p.x,p.y); if(g.mhp<=0){ killCurrent(); return; } } }
  g.proj=g.proj.filter(p=>p.life>0&&p.x>-10&&p.x<VW+10&&p.y>WATER_Y-30&&p.y<VH+10);

  // sea mines (5%) — explode when monster touches
  for(const mn of g.mines){ mn.arm-=dt; mn.blink+=dt;
    if(mn.arm<=0 && dist(mn.x,mn.y,g.mx,g.my)<g.mrad+5){ mn.dead=true; damageMonster(g.mhpMax*DMG_TOOL,mn.x,mn.y); g.shake=7; sfx('boom');
      for(let i=0;i<18;i++) g.parts.push({x:mn.x,y:mn.y,vx:rnd(-90,90),vy:rnd(-90,90),life:0.6,col:i%2?'#ffd23b':'#ff7a3a'}); if(g.mhp<=0){ killCurrent(); return; } } }
  g.mines=g.mines.filter(mn=>!mn.dead);

  for(const s of g.rigShots){ if(s.kind==='bomb') s.vy+=200*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt;
    if(dist(s.x,s.y,g.mx,g.my)<g.mrad+(s.kind==='bomb'?4:0)){ s.dead=true; damageMonster(g.mhpMax*DMG_TOOL,s.x,s.y); g.shake=6; sfx('boom');
      for(let i=0;i<16;i++) g.parts.push({x:s.x,y:s.y,vx:rnd(-90,90),vy:rnd(-90,90),life:0.6,col:i%2?'#ffd23b':'#ff7a3a'}); if(g.mhp<=0){ killCurrent(); return; } }
    else if(s.kind==='bomb'&&s.y>SEA_BOTTOM){ s.dead=true; sfx('boom'); for(let i=0;i<8;i++) g.parts.push({x:s.x,y:SEA_BOTTOM,vx:rnd(-50,50),vy:rnd(-30,0),life:0.4,col:'#8fb8cc'}); }
    else if(s.life<=0||s.x<-12||s.x>VW+12||s.y<-12||s.y>VH+12) s.dead=true; }
  g.rigShots=g.rigShots.filter(s=>!s.dead);

  // ---- monster AI ----
  g.mrad=30*m.size; const toP=Math.atan2(g.py-g.my,g.px-g.mx), dP=dist(g.px,g.py,g.mx,g.my); g.mtimer-=dt;
  if(g.mstate==='lurk'){ g.mvx=Math.cos(g.elapsed*0.7)*10*m.spd; g.mvy=Math.cos(g.elapsed*0.5)*8;
    if(g.mtimer<=0){ g.mstate='approach'; g.mtimer=rnd(1.8,3.6)/(0.6+aggro); } }
  else if(g.mstate==='approach'){ const sp=(32+aggro*80)*m.spd; g.mvx=Math.cos(toP)*sp; g.mvy=Math.sin(toP)*sp*0.8;
    if(dP<76+aggro*22 && g.mtimer<=0){ g.mstate='attack'; g.mtimer=0.7; g.attackLanded=false; g.telegraph=0.35; sfx('swoosh'); if(g.isEmma){ g.smashT=1.1; sfx('smash'); } }
    if(g.mtimer<=-2 && Math.random()<0.01) g.mstate='lurk'; }
  else if(g.mstate==='attack'){ const sp=(140+aggro*160)*m.spd; g.mvx=Math.cos(toP)*sp; g.mvy=Math.sin(toP)*sp;
    if(!g.attackLanded && dP<g.mrad*0.7+16){ g.attackLanded=true; if(g.invul<=0&&g.stun<=0&&!g.rig) hitPlayer(g,15); }
    if(g.mtimer<=0){ g.mstate='retreat'; g.mtimer=rnd(0.55,1.05)/(0.5+aggro); } }
  else if(g.mstate==='retreat'){ g.mvx=-Math.cos(toP)*95; g.mvy=-Math.sin(toP)*60-10;
    if(g.mtimer<=0){ g.mstate='approach'; g.mtimer=rnd(1.2,2.6)/(0.6+aggro); } }
  if(g.scared>0){ g.scared-=dt; g.mvx-=Math.cos(toP)*40; }
  g.telegraph-=dt; g.mx=clamp(g.mx+g.mvx*dt,30,VW-30); g.my=clamp(g.my+g.mvy*dt,WATER_Y+18,SEA_BOTTOM-14); g.faceMR=(g.px>g.mx)?1:-1;

  g.roarCd-=dt; if(g.roarCd<=0){ sfx('roar',m.kind==='emma'?1.4:(m.kind==='cthulhu'?0.7:(m.kind==='seaeater'?0.85:1))); g.roarCd=rnd(3.5,6.5)/(0.6+aggro); }
  g.swimCd-=dt; if(g.swimCd<=0 && (g.mstate==='approach'||g.mstate==='lurk')){ sfx('swim'); g.swimCd=rnd(1.1,2.2); }

  if(g.isEmma){ g.fartCd-=dt; if(g.fartCd<=0){ g.farts.push({x:g.mx,y:g.my+8,r:6,life:4,cd:0}); sfx('fart'); g.fartCd=rnd(2.2,3.6); } if(g.smashT>0) g.smashT-=dt; }
  for(const f of g.farts){ f.r+=14*dt; f.y-=8*dt; f.life-=dt; f.cd-=dt;
    if(dist(f.x,f.y,g.px,g.py)<f.r && f.cd<=0 && g.invul<=0 && !g.rig){ hitPlayer(g,8); f.cd=0.7; } }
  g.farts=g.farts.filter(f=>f.life>0);
  tickCommon(dt);
}
function tickCommon(dt){ const g=G;
  if(g.drone.cd>0) g.drone.cd-=dt; if(g.subTool.cd>0) g.subTool.cd-=dt; if(g.plantCd>0) g.plantCd-=dt;
  if(g.stun>0) g.stun-=dt; if(g.invul>0) g.invul-=dt; if(g.shake>0) g.shake-=dt*10; if(g.flash>0) g.flash-=dt; if(g.redFlash>0) g.redFlash-=dt;
  for(const b of g.bubbles){ b.y-=b.v*dt; if(b.y<WATER_Y){ b.y=VH; b.x=rnd(0,VW);} } updateParts(dt); }
function driveRig(dt,ix,iy){ const g=G,r=g.rig; r.timer-=dt; r.fireCd-=dt;
  const sp=r.type==='drone'?135:120;
  r.x=clamp(r.x+ix*sp*dt,10,VW-10);
  r.y=clamp(r.y+iy*sp*dt, r.type==='drone'?8:WATER_Y+6, SEA_BOTTOM-6);
  if(ix||iy) r.dir=Math.atan2(iy,ix);
  if((fireHeld||keys[' ']) && r.fireCd<=0){ r.fireCd=0.12; // unlimited, no real delay
    if(r.type==='drone'){ g.rigShots.push({kind:'bomb',x:r.x,y:r.y+4,vx:0,vy:40,life:3}); sfx('mine'); }
    else { g.rigShots.push({kind:'torp',x:r.x,y:r.y,vx:Math.cos(r.dir)*240,vy:Math.sin(r.dir)*240,life:2}); sfx('torp'); } }
  if(r.timer<=0) endRig();
}
function damageMonster(amt,fx,fy){ const g=G; g.mhp-=amt; g.flash=0.12; const gp=1-(g.timeLeft/RUN_SECONDS), aggro=clamp((0.14+gp*0.86)*g.diff.aggroMul,0.14,1);
  g.scared=Math.max(g.scared,clamp(1.4-aggro,0.3,1.4)); if(!g.rig){ g.mstate='retreat'; g.mtimer=g.scared; } sfx('scare');
  for(let i=0;i<6;i++) g.parts.push({x:fx,y:fy,vx:rnd(-40,40),vy:rnd(-40,40),life:0.4,col:'#ffd23b'}); }
function hitPlayer(g,dmg){ g.php-=dmg; g.hits++; g.invul=0.5; g.shake=5; sfx('hit');
  for(let i=0;i<8;i++) g.parts.push({x:g.px,y:g.py,vx:rnd(-50,50),vy:rnd(-50,50),life:0.5,col:'#ff5a4a'});
  if(g.hits>=5){ g.stun=2.4; g.hits=0; sfx('stun'); g.shake=8; } if(g.php<=0) loseGame(); }
function updateParts(dt){ for(const p of G.parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; } G.parts=G.parts.filter(p=>p.life>0); }

  if(g.pendingNext==='emma'){ text('!!  SECRET BOSS  !!',VW/2,VH/2-30,'#ff5a8a',13,'center'); text('EMMA APPROACHES',VW/2,VH/2-6,'#ffe89a',14,'center'); text('"EMMA SMASH!!"',VW/2,VH/2+18,'#9bcf5a',9,'center'); }
  else if(g.pendingNext==='cthulhu'){ text('!!  FINAL BOSS  !!',VW/2,VH/2-30,'#7ff0a0',13,'center'); text('CTHULHU RISES',VW/2,VH/2-6,'#9fd06a',14,'center'); text('the deep itself wakes',VW/2,VH/2+18,'#8fb8cc',8,'center'); }
  else { text('SPECIMEN NEUTRALIZED',VW/2,VH/2-24,'#7ff0a0',12,'center'); text('NEXT: '+MONSTERS[g.pendingNext].name,VW/2,VH/2-2,'#ffd23b',12,'center'); }
  text('+ HULL RESTORED',VW/2,VH/2+40,'#2ec26a',8,'center'); }
function renderFinisher(g){
  if(g.result==='win'){ const p=clamp(g.finish/2.4,0,1); ctx.fillStyle=`rgba(2,6,14,${p*0.9})`; ctx.fillRect(0,0,VW,VH);
    if(g.resultHow==='survived'){ text('YOU SURVIVED',VW/2,VH/2-14,'#7ff0a0',14,'center'); text('the clock ran out. the deep let you go.',VW/2,VH/2+6,'#bfe6ff',8,'center'); }
    else { text('YOU CLEARED THE HUNT',VW/2,VH/2-14,'#7ff0a0',13,'center'); text('every monster, Emma, and Cthulhu — down.',VW/2,VH/2+6,'#bfe6ff',8,'center'); } return; }
  if(g.finish<1.6){ ctx.fillStyle='rgba(20,0,0,0.55)'; ctx.fillRect(0,0,VW,VH);
    ctx.save(); ctx.translate(VW/2,VH/2+16); const sc=1.7+g.finish*0.9; ctx.scale(sc,sc);
    const ox=g.mx,oy=g.my,ost=g.mstate,otel=g.telegraph,opx=g.px; g.mx=0; g.my=0; g.mstate='attack'; g.mtimer=0.35; g.telegraph=0.35; g.px=100;
    drawMonster(g,1); g.mx=ox; g.my=oy; g.mstate=ost; g.telegraph=otel; g.px=opx; ctx.restore();
    if(Math.floor(g.finish*8)%2){ const big=g.isEmma?'EMMA SMASH!!':'FINISH!'; text(big,VW/2,30,'#ff2a2a',26,'center'); }
    text(g.isEmma?'YOU ARE A SNACK':(g.m.name+' HAS YOU'),VW/2,VH-40,'#ffdede',11,'center');
  } else { const q=clamp((g.finish-1.6)/2.6,0,1); ctx.fillStyle=`rgba(2,2,6,${q*0.92})`; ctx.fillRect(0,0,VW,VH);
    if(g.finishKind==='drag'){ for(let t=0;t<8;t++) for(let s=0;s<14;s++){ const tx=g.px+Math.sin(t*1.3+s*0.4)*(s*2)+(t-4)*6,ty=g.py+s*8*q-20; px(tx-3,ty,6,8,s%2?'#204028':'#2f5a3a'); } text('DRAGGED INTO THE DARK',VW/2,30,'#9fd06a',12,'center'); }
    else { const jaw=q*60; px(0,VH/2-70-jaw,VW,60,'#0a0406'); px(0,VH/2+10+jaw,VW,80,'#0a0406');
      for(let i=0;i<VW;i+=16){ px(i,VH/2-14-jaw,10,20+jaw*0.4,'#d8d0b0'); px(i+6,VH/2+jaw-2,10,20+jaw*0.4,'#d8d0b0'); }
      px(120,VH/2-40-jaw,26,26,'#ff5a2a'); px(320,VH/2-40-jaw,26,26,'#ff5a2a'); text(g.isEmma?'EMMA ATE YOU':'SWALLOWED WHOLE',VW/2,20,'#ff6a4a',12,'center'); }
    if(g.finish>3.4) text('tap to continue',VW/2,VH-24,'#8fb8cc',8,'center'); }
}
function renderHUD(g){ bar(8,8,120,8,g.php/g.phpMax,'#2ec26a','#0a2a18'); text('HULL',10,9,'#04140c',7);
  bar(VW-128,8,120,8,g.mhp/g.mhpMax,g.isEmma?'#ff5a8a':(g.isCthulhu?'#7ff0a0':'#c0392b'),'#2a0d0a'); text(g.m.name,VW-126,9,'#ffdede',7);
  const mm=Math.floor(Math.max(0,g.timeLeft)/60),ss=Math.floor(Math.max(0,g.timeLeft)%60);
  text((mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss,VW/2,6,g.timeLeft<60?'#ff6a6a':'#dfe6e6',12,'center');
  const label=g.isCthulhu?'FINAL BOSS':(g.isEmma?'SECRET BOSS':('MONSTER '+(g.killedCount+1)+'/6'));
  text(label+'  ·  '+g.diff.name,VW/2,20,'#8fb8cc',7,'center');
  text('RAGE',10,20,'#ff9a6a',7); for(let i=0;i<16;i++) px(38+i*4,20,3,6,i<g.aggroLvl?'#ff5a3a':'#33202a');
  for(let i=0;i<5;i++) px(10+i*7,30,5,5,i<g.hits?'#ffd23b':'#20303a'); }
function bar(x,y,w,h,f,col,bgc){ px(x,y,w,h,bgc); px(x,y,Math.max(0,w*f),h,col); px(x,y,w,1,'rgba(255,255,255,0.25)'); }
function renderTouchControls(g){ const pov=!!g.rig;
  const fl=pov?(g.rig.type==='drone'?'BOMB':'TORP'):'FIRE'; ring(fireBtn.x,fireBtn.y,fireBtn.r,'#3a1416','#ff6a5a'); text(fl,fireBtn.x,fireBtn.y-4,'#ffdede',9,'center');
  ring(subBtn.x,subBtn.y,subBtn.r,g.subTool.cd>0?'#20303a':'#12303a',g.rig&&g.rig.type==='sub'?'#7ff0a0':((g.subTool.cd<=0&&!pov)?'#4a7a8a':'#334'));
  text('SUB',subBtn.x,subBtn.y-4,(g.subTool.cd<=0&&!pov)?'#bfe6ff':'#44586a',8,'center'); if(g.subTool.cd>0) text(Math.ceil(g.subTool.cd),subBtn.x,subBtn.y+4,'#ff9a6a',7,'center');
  ring(droneBtn.x,droneBtn.y,droneBtn.r,g.drone.cd>0?'#20303a':'#12303a',g.rig&&g.rig.type==='drone'?'#7ff0a0':((g.drone.cd<=0&&!pov)?'#4a7a8a':'#334'));
  text('DRN',droneBtn.x,droneBtn.y-4,(g.drone.cd<=0&&!pov)?'#bfe6ff':'#44586a',8,'center'); if(g.drone.cd>0) text(Math.ceil(g.drone.cd),droneBtn.x,droneBtn.y+4,'#ff9a6a',7,'center');
  const mineReady=g.minesLeft>0&&!pov; ring(mineBtn.x,mineBtn.y,mineBtn.r,g.minesLeft<=0?'#20303a':'#2a2410',mineReady?'#ffd23b':'#334');
  text('MINE',mineBtn.x,mineBtn.y-5,mineReady?'#ffe89a':'#44586a',7,'center'); text('x'+g.minesLeft,mineBtn.x,mineBtn.y+3,mineReady?'#ffd23b':'#556',8,'center');
  if(joy.active){ ctx.strokeStyle='rgba(180,220,240,0.4)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,26,0,7); ctx.stroke();
    const dx=clamp(joy.x-joy.ox,-26,26),dy=clamp(joy.y-joy.oy,-26,26); ctx.fillStyle='rgba(127,240,160,0.7)'; ctx.beginPath(); ctx.arc(joy.ox+dx,joy.oy+dy,10,0,7); ctx.fill(); } }
function ring(x,y,r,fill,edge){ ctx.fillStyle=fill; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); ctx.strokeStyle=edge; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.stroke(); }
function renderEnd(win){ bg2(); text(win?'VICTORY':'GAME OVER',VW/2,VH/2-30,win?'#7ff0a0':'#ff5a4a',20,'center');
  text(win?'You are the last thing the deep fears.':'The deep keeps what it takes.',VW/2,VH/2+2,'#8fb8cc',9,'center');
  button(VW/2-60,VH/2+24,120,24,'► NEW HUNT',true); uiButtons[uiButtons.length-1].id='again'; text('tap to return to title',VW/2,VH-24,'#4a5f72',8,'center'); }
requestAnimationFrame(loop);
</script>
